services:
  app:
    build: .
    profiles: [app]
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-credit_tracker}
      DB_USERNAME: ${DB_USERNAME:-tracker}
      DB_PASSWORD: ${DB_PASSWORD:-tracker_local}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-credit_tracker}
      POSTGRES_USER: ${DB_USERNAME:-tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tracker_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
