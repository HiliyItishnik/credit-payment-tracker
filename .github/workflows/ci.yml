name: Java and PostgreSQL checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: credit_tracker_test
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d credit_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/credit_tracker_test
      TEST_DB_USERNAME: tracker
      TEST_DB_PASSWORD: tracker_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, migrations and API integration tests
        run: mvn -B --no-transfer-progress -Pintegration clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser payment retry checks
        run: node --test src/test/js/app.test.cjs
      - name: Check browser scripts
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/budget.js
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and start application with PostgreSQL
        env:
          COMPOSE_PROJECT_NAME: tracker-ci
          APP_PORT: '18080'
          DB_PORT: '15432'
          DB_PASSWORD: tracker_ci
        run: docker compose --profile app up -d --build --wait --wait-timeout 180
      - name: Verify HTTP and database readiness
        run: |
          curl --fail http://127.0.0.1:18080/actuator/health/readiness
          curl --fail http://127.0.0.1:18080/api/loans
          curl --fail http://127.0.0.1:18080/budget.html > /dev/null
      - name: Show container logs
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: tracker-ci
        run: docker compose --profile app logs --no-color
      - name: Stop test containers
        if: always()
        env:
          COMPOSE_PROJECT_NAME: tracker-ci
        run: docker compose --profile app down --volumes
